name: Release desktop (Steam)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: desktop:dist:win, out: release/win-unpacked, name: windows }
          - { os: ubuntu-latest, script: desktop:dist:linux, out: release/linux-unpacked, name: linux }
          - { os: macos-latest, script: desktop:dist:mac, out: release/mac-universal, name: mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run test:unit
      # Falha de propósito se game/src/assets/fonts/VT323-Regular.woff2 não estiver no repositório
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: estacao-333-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error
