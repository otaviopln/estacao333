name: Build desktop (Steam)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: dist:win, out: desktop/release/win-unpacked, name: windows }
          - { os: ubuntu-latest, script: dist:linux, out: desktop/release/linux-unpacked, name: linux }
          - { os: macos-latest, script: dist:mac, out: desktop/release/mac-universal, name: mac }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: estacao-333-${{ matrix.name }}
          path: ${{ matrix.out }}
